name: ci

# Correctness gate. The test suite is this project's behavioural contract and
# bench/golden_traj.py is its bitwise env-behaviour hash — a throughput change
# that moves either is not an optimisation, it is a regression.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: System libs for headless MuJoCo rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6-dev libgl1 libglfw3 ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .

      - name: Versions
        run: |
          python -c "import torch, gymnasium, stable_baselines3, mujoco, numpy; \
            print('torch', torch.__version__); print('gymnasium', gymnasium.__version__); \
            print('sb3', stable_baselines3.__version__); print('mujoco', mujoco.__version__); \
            print('numpy', numpy.__version__)"
          nproc

      - name: Runner provenance
        run: |
          grep -m1 'model name' /proc/cpuinfo
          if grep -qm1 avx512f /proc/cpuinfo; then echo "ISA avx512f=yes"; else echo "ISA avx512f=no"; fi

      # Recorded, not gated: the bitwise hash is machine-dependent (two stable
      # values across the runner pool — see golden-portability.yml), so failing
      # on it here fails on the luck of the runner draw rather than on a code
      # change.
      - name: Golden trajectory hash (bitwise — recorded, not gated)
        run: |
          python bench/golden_traj.py --check \
            || echo "(bitwise hash differs from the reference machine — expected on the other CPU population)"

      # The portable behaviour gate. Tolerance chosen from the measured
      # cross-population divergence (max |reward diff| 5.551e-17, obs bitwise
      # identical), not guessed — see golden_traj.py. Structural divergence
      # (termination pattern, hit sequence) fails regardless of tolerance.
      - name: Golden trajectory (numeric, portable — GATE)
        run: python bench/golden_traj.py --check-approx bench/golden_traj_ref.npz

      - name: Test suite
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: python -m pytest tests/ -q
